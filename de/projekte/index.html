<style>
body{margin:0;background:#161616}
a{color:inherit;text-decoration:none}
:root{--ease:cubic-bezier(0.16,1,0.3,1)}
.wrap{max-width:none;margin:0;padding:0 clamp(16px,4vw,72px);box-sizing:border-box}
h1,h2,h3,.h-black{text-wrap:balance;hyphens:manual;-webkit-hyphens:manual;overflow-wrap:normal;word-break:normal}p,li,dd{text-wrap:pretty}.h-black{font-family:'Archivo Black','Archivo',sans-serif;font-weight:400;text-transform:uppercase;letter-spacing:-0.01em;margin:0}
.eyebrow{font-family:'Archivo',sans-serif;font-weight:600;font-size:13px;letter-spacing:.14em;text-transform:uppercase;display:inline-flex;align-items:center;gap:10px}
.dot{width:8px;height:8px;border-radius:50%;background:#FF5F57;display:inline-block}
.btn{display:inline-flex;align-items:center;gap:12px;min-height:52px;padding:0 26px;font-family:'Archivo',sans-serif;font-weight:700;font-size:14px;letter-spacing:.08em;text-transform:uppercase;border:2px solid #161616;background:#FF5F57;color:#161616;box-shadow:5px 5px 0 #000;transition:transform 150ms var(--ease),box-shadow 150ms var(--ease),background 150ms var(--ease)}
.btn:hover{transform:translate(-3px,-3px);box-shadow:8px 8px 0 #000;background:#FFFFFF}
.nav a:not(.btn){position:relative;font-family:'Archivo',sans-serif;font-weight:600;font-size:14px;letter-spacing:.06em;text-transform:uppercase;color:#EFEFEF;padding:6px 0}
.nav a:not(.btn)::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;background:#FF5F57;transform:scaleX(0);transform-origin:right;transition:transform 200ms var(--ease)}
.nav a:not(.btn):hover::after,.nav a[aria-current="page"]::after{transform:scaleX(1);transform-origin:left}
.chip{font-family:'Archivo',sans-serif;font-weight:700;font-size:13px;letter-spacing:.08em;text-transform:uppercase;min-height:44px;padding:0 18px;border:2px solid #EFEFEF;cursor:pointer;transition:transform 100ms var(--ease),background 150ms var(--ease),color 150ms var(--ease)}
.chip:active{transform:scale(.95)}
.tile{display:flex;flex-direction:column;gap:16px}
.tile .frame{position:relative;overflow:hidden;border:2px solid #000000;box-shadow:10px 10px 0 #000000;transition:transform 250ms var(--ease),box-shadow 250ms var(--ease)}
.tile:hover .frame{transform:translate(-4px,-4px);box-shadow:14px 14px 0 #FF5F57}
.tile img{width:100%;aspect-ratio:16 / 10;object-fit:cover;display:block;transition:transform 900ms var(--ease)}
.tile:hover img{transform:scale(1.05)}
.tag{position:absolute;left:14px;top:14px;font-family:'Archivo',sans-serif;font-weight:700;font-size:12px;letter-spacing:.1em;text-transform:uppercase;background:#FF5F57;color:#161616;padding:6px 10px}
.foot a:hover{color:#FF5F57}
@keyframes m-blink{0%,100%{opacity:1}50%{opacity:.3}}
@keyframes m-in{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:no-preference){.dot{animation:m-blink 1.6s ease-in-out infinite}.tile{animation:m-in 600ms var(--ease) both}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition-duration:0s!important}}

.lang{display:flex;align-items:center;gap:2px;font-family:'Archivo',sans-serif;font-weight:700;font-size:13px;letter-spacing:.06em}.lang a{padding:6px 7px;color:#161616;border:2px solid transparent;line-height:1}.lang a:hover{border-color:#161616}.lang a[aria-current="true"]{background:#161616;color:#EFEFEF}.menu .lang a{color:#EFEFEF;font-size:15px}.menu .lang a:hover{border-color:#EFEFEF}.menu .lang a[aria-current="true"]{background:#FF5F57;color:#161616}.lang-dd{position:relative;font-family:'Archivo',sans-serif;font-weight:700;font-size:13px;letter-spacing:.06em}.lang-dd summary{list-style:none;cursor:pointer;display:inline-flex;align-items:center;gap:8px;height:46px;padding:0 14px;border:2px solid #161616;background:#EFEFEF;color:#161616;box-sizing:border-box;user-select:none}.lang-dd summary::-webkit-details-marker{display:none}.lang-dd summary:hover{background:#FFFFFF}.lang-dd .chev{transition:transform 200ms var(--ease)}.lang-dd[open] .chev{transform:rotate(180deg)}.lang-dd .lang-list{position:absolute;right:0;top:calc(100% + 8px);min-width:170px;display:flex;flex-direction:column;background:#FFFFFF;border:2px solid #161616;box-shadow:6px 6px 0 #161616;z-index:40;animation:dd-in 180ms var(--ease)}.lang-dd .lang-list a{display:flex;justify-content:space-between;gap:16px;padding:12px 16px;color:#161616;letter-spacing:.02em;font-size:15px}.lang-dd .lang-list a+a{border-top:1px solid #D6D6D6}.lang-dd .lang-list a:hover{background:#EFEFEF}.lang-dd .lang-list a[aria-current="true"]{background:#161616;color:#EFEFEF}.lang-dd .lang-list small{color:#8C8C8C;font-size:12px}@keyframes dd-in{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}@media (max-width:520px){.hdr .lang-dd{display:none}}.hdr{position:sticky;top:0;z-index:30;background:#EFEFEF;border-bottom:2px solid #161616;height:96px;transition:height 400ms var(--ease),box-shadow 300ms var(--ease)}
.hdr.scrolled{height:76px;box-shadow:0 6px 0 rgba(0,0,0,.35)}
.logo-link{position:relative;display:block;width:243px;height:100%}
.logo{position:absolute;left:0;top:30px;height:116px;width:auto;transform-origin:0 0;transition:transform 450ms var(--ease)}
.hdr.scrolled .logo{transform:translateY(-18px) scale(.48)}
.burger{width:46px;height:46px;display:inline-flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;background:#161616;border:2px solid #EFEFEF;box-shadow:4px 4px 0 #000;cursor:pointer;transition:transform 100ms var(--ease),box-shadow 100ms var(--ease)}
.burger:hover{transform:translate(-2px,-2px);box-shadow:6px 6px 0 #FF5F57}
.burger span{display:block;width:20px;height:3px;background:#EFEFEF;transition:transform 300ms var(--ease),opacity 200ms}
.burger[aria-expanded="true"] span:nth-child(1){transform:translateY(9px) rotate(45deg)}
.burger[aria-expanded="true"] span:nth-child(2){opacity:0}
.burger[aria-expanded="true"] span:nth-child(3){transform:translateY(-9px) rotate(-45deg)}
.menu{position:fixed;inset:0;z-index:25;background:#161616;padding:160px 0 56px;box-sizing:border-box;overflow-y:auto;transform:translateY(-100%);visibility:hidden;transition:transform 500ms var(--ease),visibility 0s 500ms}
.menu{height:100vh;height:100dvh;display:flex;flex-direction:column;padding:clamp(120px,18svh,160px) 0 clamp(24px,5svh,56px)}.menu-in{flex:1 1 auto;min-height:0;align-content:space-between;align-items:flex-end;row-gap:clamp(20px,4svh,48px)!important}.menu-links{gap:clamp(4px,1.2svh,10px)!important}.menu-contact{font-size:clamp(15px,2svh,18px)!important;gap:clamp(4px,1svh,10px)!important}@media (max-height:560px){.menu-contact{display:none!important}}.menu.open{transform:none;visibility:visible;transition:transform 500ms var(--ease),visibility 0s}
.menu-links a{display:inline-flex;align-items:baseline;gap:18px;font-family:'Archivo Black','Archivo',sans-serif;text-transform:uppercase;font-size:clamp(22px,min(3.4vw,calc((100svh - 360px) / 8.6)),50px);line-height:1.05;color:#EFEFEF;opacity:0;transform:translateY(24px);transition:color 150ms,transform 500ms var(--ease),opacity 400ms var(--ease)}@media (max-height:560px){.menu-links a{font-size:clamp(20px,calc((100svh - 190px) / 8.6),44px)}}
.menu.open .menu-links a{opacity:1;transform:none}
.menu.open .menu-links li:nth-child(2) a{transition-delay:60ms}.menu.open .menu-links li:nth-child(3) a{transition-delay:120ms}.menu.open .menu-links li:nth-child(4) a{transition-delay:180ms}.menu.open .menu-links li:nth-child(5) a{transition-delay:240ms}.menu.open .menu-links li:nth-child(6) a{transition-delay:300ms}
.menu-links a:hover{color:#FF5F57}
.menu-links a[aria-current="page"]{color:#FF5F57}
.menu-links small{font-family:'Archivo',sans-serif;font-size:12px;letter-spacing:.1em;color:#8C8C8C}
@keyframes m-logo{0%{scale:.35;opacity:0}60%{opacity:1}100%{scale:1;opacity:1}}
@media (prefers-reduced-motion:no-preference){.logo{animation:m-logo 900ms cubic-bezier(.34,1.56,.64,1) 100ms both}}
@media (max-width:560px){.logo-link{width:124px}.logo{height:56px}.hdr .btn.cta{display:none}}
</style>
